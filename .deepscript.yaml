# DeepScript configuration
# See PRD-deepscript.md section 9 for full schema

# Classification
classify: true
# custom_classifications:
#   board-meeting:
#     keywords: [board, directors, governance, fiduciary, resolution, quorum]

# Topic segmentation
topics:
  enabled: true
  method: hybrid            # rule | llm | hybrid
  min_duration: 60
  index: true

# Communication insights (rule-based, free)
communication:
  enabled: true
  speaking_balance: true
  engagement: true

# Business meeting analysis
business:
  summary: true
  action_items: true
  decisions: true
  questions: true

# Sales call analysis
sales:
  enabled: true
  methodology: meddic       # meddic | bant | spin | challenger
  competitors: []
  close_coaching: true
  phase_detection: true

# Customer discovery analysis
discovery:
  enabled: true
  framework: mom_test        # mom_test | jtbd | problem_solution
  pain_extraction: true
  insight_mapping: true

# LLM configuration
llm:
  provider: nim              # claude | openai | ollama | vllm | sglang | nim | none
  model: claude-sonnet-4-6
  nim_model: qwen/qwen3.5-397b-a17b  # Top NIM model — benchmarked 2026-05-31: quality 8.92, F1 0.84, grounding 0.97
  redact_names: false
  budget_per_month: 1000000.00  # NIM is free; budget guard uses Claude pricing as proxy. Set very high to avoid false trips.
  cost_tracking: true

# Output
output:
  format: markdown           # markdown | json
  sections: all              # all | [summary, actions, communication]
